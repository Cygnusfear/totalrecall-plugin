# Total Recall v3 - Development Stack with pgAdmin
# Extends the base stack with pgAdmin for database visualization
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Access pgAdmin at http://localhost:5050
# Login: admin@totalrecall.local / admin

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: totalrecall-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@totalrecall.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      vchord:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgadmin-data:
    name: totalrecall-pgadmin-data
